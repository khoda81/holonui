[package]
name = "holonui"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
eframe = "0.34"
egui = "0.34"
egui_plot = "0.35"
log = "0.4"
reqwest = "0.13"
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
tokio = { version = "1.15", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
