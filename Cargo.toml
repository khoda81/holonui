[package]
name = "holonui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.34"
egui = "0.34"
egui_plot = "0.35"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", features = ["json", "rustls", "query"] }
dotenvy = "0.15"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
